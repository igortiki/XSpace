name: XSpace

options:
  bundleIdPrefix: com.woow.iapcore
  deploymentTarget:
    iOS: "17.6"
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # XcodeGen presets lag behind the Xcode template - pin these explicitly
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: gnu17

packages:
  XSpaceCore:
    path: ../Packages/XSpaceCore

# shared by both apps
targetTemplates:
  App:
    type: application
    dependencies:
      - package: XSpaceCore
    settings:
      base:
        PRODUCT_NAME: XSpace
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

targets:
  XSpace-iOS:
    templates: [App]
    platform: iOS
    sources:
      - path: XSpace-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woow.iapcore.XSpace
        INFOPLIST_FILE: XSpace-iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  XSpace-tvOS:
    templates: [App]
    platform: tvOS
    sources:
      - path: XSpace-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woow.iapcore.XSpace.tvos
        INFOPLIST_FILE: XSpace-tvOS/Info.plist
        TARGETED_DEVICE_FAMILY: "3"

schemes:
  XSpace-iOS:
    build:
      targets:
        XSpace-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  XSpace-tvOS:
    build:
      targets:
        XSpace-tvOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
